<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRONTIER MAN — Before the Silence</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .video-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.9) contrast(1.05);
    }
    .hero-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      text-align: center;
      padding: 20px;
    }
    .title-group {
      animation: fadeInOutLoop 7s infinite ease-in-out;
      transform: translateX(10.2vw) translateY(-2vh);
      background: transparent;
      padding: 0;
      border: none;
      box-shadow: none;
    }
    h1.fm-title {
      font-size: clamp(2rem, 5vw, 4.5rem) !important;
      font-weight: 900 !important;
      letter-spacing: 8px !important;
      margin: 0 0 12px 0 !important;
      color: #00f0ff !important;
      text-transform: uppercase !important;
      text-shadow: 
         3px  3px 0px #5a189a,
        -3px  3px 0px #5a189a,
         3px -3px 0px #5a189a,
        -3px -3px 0px #5a189a,
         0px  0px 25px rgba(0, 240, 255, 0.8) !important;
    }
    .fm-subtitle {
      font-size: clamp(0.9rem, 1.8vw, 1.3rem) !important;
      color: #0a0a0c !important;
      letter-spacing: 5px !important;
      text-transform: uppercase !important;
      margin-bottom: 16px !important;
      font-weight: 800 !important;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9) !important;
    }
    .fm-byline {
      font-size: clamp(0.75rem, 1.2vw, 0.95rem) !important;
      color: #9d4edd !important;
      letter-spacing: 4px !important;
      text-transform: uppercase !important;
      font-weight: 700 !important;
      margin-bottom: 24px !important;
      text-shadow: 
         2px  2px 0px #00f0ff,
        -2px  2px 0px #00f0ff,
         2px -2px 0px #00f0ff,
        -2px -2px 0px #00f0ff !important;
    }
    .fm-waitlist {
      pointer-events: auto;
      display: inline-block;
      font-size: clamp(0.7rem, 1.1vw, 0.85rem) !important;
      color: #ffffff !important;
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid #00f0ff;
      padding: 10px 20px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .fm-waitlist:hover {
      background: #00f0ff;
      color: #000000;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    @keyframes fadeInOutLoop {
      0% { opacity: 0; transform: translateX(10.2vw) translateY(-2vh) scale(0.98); }
      30% { opacity: 1; transform: translateX(10.2vw) translateY(-2vh) scale(1); }
      70% { opacity: 1; transform: translateX(10.2vw) translateY(-2vh) scale(1); }
      100% { opacity: 0; transform: translateX(10.2vw) translateY(-2vh) scale(1.02); }
    }
  </style>
</head>
<body>

  <video class="video-bg" autoplay muted loop playsinline>
    <source src="../VEO/frontiermanobject.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div class="hero-overlay">
    <div class="title-group">
      <h1 class="fm-title">FRONTIER MAN</h1>
      <div class="fm-subtitle">Before the Silence</div>
      <div class="fm-byline">// GRAPHIC NOVEL BY PSEUDO RUNNER</div>
      <div>
        <a href="mailto:aiscifi@codes.gallery?subject=Frontier%20Man%20Waitlist" class="fm-waitlist">JOIN THE WAITLIST -></a>
      </div>
    </div>
  </div>

</body>
</html>
