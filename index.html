<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRONTIER MAN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: #000000;
            color: #00ffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Flow image background */
        .bg-image {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('placeholder.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            filter: grayscale(100%) contrast(130%);
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 20px;
        }
        
        /* Plain text with glow + disappear loop */
        .title {
            font-family: 'JetBrains Mono', 'Courier New', monospace !important;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #00ffff;
            animation: glowDisappear 4s ease-in-out infinite;
        }
        
        @keyframes glowDisappear {
            0% { opacity: 0.3; text-shadow: 0 0 5px rgba(0, 255, 255, 0.3); }
            15% { opacity: 1; text-shadow: 0 0 10px rgba(0, 255, 255, 0.9), 0 0 20px rgba(0, 255, 255, 0.6), 0 0 40px rgba(0, 255, 255, 0.3); }
            30% { opacity: 1; text-shadow: 0 0 20px rgba(0, 255, 255, 1), 0 0 40px rgba(0, 255, 255, 0.8), 0 0 80px rgba(0, 255, 255, 0.5); }
            45% { opacity: 1; text-shadow: 0 0 10px rgba(0, 255, 255, 0.9), 0 0 20px rgba(0, 255, 255, 0.6), 0 0 40px rgba(0, 255, 255, 0.3); }
            55% { opacity: 0; text-shadow: none; }
            100% { opacity: 0; text-shadow: none; }
        }
        
        .subtitle {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            opacity: 0.7;
            margin-top: 20px;
            font-style: italic;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: subtitlePulse 4s ease-in-out infinite;
        }
        
        @keyframes subtitlePulse {
            0%, 55%, 100% { opacity: 0.4; }
            15%, 45% { opacity: 0.7; }
        }
        
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 255, 255, 0.008) 50%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            animation: scan 8s linear infinite;
        }
        
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    
    <div class="container">
        <h1 class="title">FRONTIER MAN</h1>
        <div class="subtitle">// GRAPHIC NOVEL BY RUNNER</div>
    </div>
    
    <div class="scanlines"></div>
</body>
</html>
