    <meta name="keywords" content="sci-fi, fantasy, romance, novel, graphic novel, epub, terminal aesthetic, cyberpunk, AI fiction, Runner">
    
    <!-- JSON-LD structured data for Book / CreativeWork -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Book",
      "name": "FRONTIER MAN",
      "author": {
        "@type": "Person",

      },

      "workExample": {
        "@type": "Book",
        "bookFormat": "EBook",
        "bookEdition": "Graphic Novel",
        "potentialAction": {
          "@type": "ReadAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://aiscifi.net/",
            "actionPlatform": ["http://schema.org/DesktopWebPlatform", "http://schema.org/MobileWebPlatform"]
          }
        }
      }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: #000000;
            color: #00ffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Flow image background - more visible on mobile */
        .bg-image {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('placeholder.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            filter: grayscale(100%) contrast(140%);
            z-index: 0;
        }
        
        @media (max-width: 768px) {
            .bg-image {
                opacity: 0.25;
                filter: grayscale(100%) contrast(150%);
            }
        }
        
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 20px;
        }
        
        /* Plain text with glow + disappear loop */
        .title {
            font-family: 'JetBrains Mono', 'Courier New', monospace !important;
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #00ffff;
            animation: glowDisappear 4s ease-in-out infinite;
        }
        
        @keyframes glowDisappear {
            0% { opacity: 0.3; text-shadow: 0 0 5px rgba(0, 255, 255, 0.3); }
            15% { opacity: 1; text-shadow: 0 0 10px rgba(0, 255, 255, 0.9), 0 0 20px rgba(0, 255, 255, 0.6), 0 0 40px rgba(0, 255, 255, 0.3); }
            30% { opacity: 1; text-shadow: 0 0 20px rgba(0, 255, 255, 1), 0 0 40px rgba(0, 255, 255, 0.8), 0 0 80px rgba(0, 255, 255, 0.5); }
            45% { opacity: 1; text-shadow: 0 0 10px rgba(0, 255, 255, 0.9), 0 0 20px rgba(0, 255, 255, 0.6), 0 0 40px rgba(0, 255, 255, 0.3); }
            55% { opacity: 0; text-shadow: none; }
            100% { opacity: 0; text-shadow: none; }
        }
        
        .subtitle {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: clamp(0.8rem, 3vw, 1.1rem);
            opacity: 0.7;
            margin-top: 16px;
            font-style: italic;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: subtitlePulse 4s ease-in-out infinite;
        }
        
        @keyframes subtitlePulse {
            0%, 55%, 100% { opacity: 0.4; }
            15%, 45% { opacity: 0.7; }
        }
        
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 255, 255, 0.008) 50%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            animation: scan 8s linear infinite;
        }
        
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    
    <div class="container">
        <h1 class="title">FRONTIER MAN</h1>
        <div class="subtitle">// GRAPHIC NOVEL BY RUNNER</div>
        <div class="subtitle" style="margin-top: 2rem; opacity: 0.5; font-size: clamp(0.7rem, 2vw, 0.9rem);">
            <a href="mailto:hello@aiscifi.net" style="color: #00ffff; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.3s;" onmouseover="this.style.borderColor='#00ffff'" onmouseout="this.style.borderColor='transparent'">join the waitlist →</a>
        </div>
    </div>
    
    <div class="scanlines"></div>
</body>
</html>
